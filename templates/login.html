{% extends "base.html" %}
{% block title %}로그인 · 감동타임{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="h4 mb-1">관리자 로그인</h1>
    <p class="text-muted small mb-4">AI 고객 제안 챗봇을 이용하려면 로그인하세요</p>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">이메일</label>
        <input type="email" name="email" class="form-control" placeholder="admin@company.com" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">비밀번호</label>
        <input type="password" name="password" class="form-control" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>

    <p class="text-muted small mt-4 mb-0">
      데모 계정: admin@company.com / admin1234
    </p>
  </div>
</div>
{% endblock %}
