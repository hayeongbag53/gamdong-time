<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}감동타임{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav class="app-nav navbar navbar-dark px-3">
    <a class="navbar-brand" href="{{ url_for('chatbot.shop') }}">감동타임</a>
    <div class="app-nav-links">
      <a class="nav-link" href="{{ url_for('chatbot.shop') }}">쇼핑몰</a>
      <a class="nav-link" href="{{ url_for('admin.dashboard') }}">대시보드</a>
      <a class="nav-link" href="{{ url_for('history.list_view') }}">히스토리</a>
      <span class="navbar-text text-light">{{ current_user.name }}님</span>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.logout') }}">로그아웃</a>
    </div>
  </nav>
  {% endif %}

  <div class="app-body">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
